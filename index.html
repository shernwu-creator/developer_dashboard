      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              brand: {
                50: "#eef2ff",
                100: "#e0e7ff",
                500: "#6366f1", // Indigo 500
                600: "#4f46e5", // Indigo 600
                900: "#312e81",
              },

    <style>
      /* Custom Scrollbar for a premium look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* Hide scrollbar for sidebar but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Gradient Text */
      .text-gradient {
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>

    </aside>

    <!-- Main Content -->

      // Elements
      const navLinksContainer = document.getElementById("nav-links");
      const bookmarksContainer = document.getElementById("bookmarks-container");
      const searchInput = document.getElementById("search-input");
      const clearSearchBtn = document.getElementById("clear-search");
      const emptyState = document.getElementById("empty-state");
      const themeToggle = document.getElementById("theme-toggle");
      const themeIcon = document.getElementById("theme-icon");
      const themeText = document.getElementById("theme-text");
      const sidebar = document.getElementById("sidebar");
      const mobileOverlay = document.getElementById("mobile-overlay");

      // Render Sidebar Navigation
      function renderNavigation() {
        navLinksContainer.innerHTML = bookmarksData
          .map(
            (category) => `
                <a href="#${category.id}" onclick="closeSidebarOnMobile()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-brand-50 dark:hover:bg-slate-700/50 hover:text-brand-600 dark:hover:text-brand-400 transition-colors group font-medium">
                    <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center group-hover:bg-white dark:group-hover:bg-slate-700 shadow-sm transition-colors">
                        <i class="${category.icon}"></i>
                    </div>
                    <span>${category.title}</span>
                </a>
            `,
          )
          .join("");
      }

      // Render Bookmarks
      function renderBookmarks(filterText = "") {
        const lowerFilter = filterText.toLowerCase();
        let hasResults = false;
        let html = "";

        bookmarksData.forEach((category) => {
          const filteredItems = category.items.filter(
            (item) =>
              item.name.toLowerCase().includes(lowerFilter) ||
              item.desc.toLowerCase().includes(lowerFilter),
          );

          if (filteredItems.length > 0) {
            hasResults = true;
            html += `
                        <section id="${category.id}" class="scroll-mt-24">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${category.color} flex items-center justify-center text-white shadow-md">
                                    <i class="${category.icon} text-lg"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-slate-800 dark:text-white tracking-tight">${category.title}</h2>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-5">
                                ${filteredItems
                                  .map(
                                    (item) => `
                                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                                       class="group flex flex-col p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-xl hover:shadow-brand-500/10 hover:-translate-y-1 transition-all duration-300 relative overflow-hidden">
                                        <!-- Decorative top border line -->
                                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${category.color} opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                        
                                        <div class="flex items-start gap-4 mb-3">
                                            <div class="w-12 h-12 rounded-xl bg-slate-50 dark:bg-slate-700/50 flex items-center justify-center text-slate-700 dark:text-slate-300 group-hover:bg-brand-50 dark:group-hover:bg-brand-500/20 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors shrink-0">
                                                <i class="${item.icon} text-xl"></i>
                                            </div>
                                            <div>
                                                <h3 class="text-lg font-semibold text-slate-900 dark:text-slate-100 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">${item.name}</h3>
                                                <div class="text-xs font-mono text-slate-400 dark:text-slate-500 truncate w-40 sm:w-48 mt-0.5">${new URL(item.url).hostname}</div>
                                            </div>
                                        </div>
                                        <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed mt-auto group-hover:text-slate-700 dark:group-hover:text-slate-300 transition-colors line-clamp-2">
                                            ${item.desc}
                                        </p>
                                    </a>
                                `,
                                  )
                                  .join("")}
                            </div>
                        </section>
                    `;
          }
        });

        if (hasResults) {
          bookmarksContainer.innerHTML = html;
          bookmarksContainer.classList.remove("hidden");
          emptyState.classList.add("hidden");
        } else {
          bookmarksContainer.classList.add("hidden");
          emptyState.classList.remove("hidden");
        }
      }

      // Search Functionality
      searchInput.addEventListener("input", (e) => {
        const val = e.target.value;
        renderBookmarks(val);
        if (val.length > 0) {
          clearSearchBtn.classList.remove("hidden");
        } else {
          clearSearchBtn.classList.add("hidden");
        }
      });

      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        renderBookmarks("");
        clearSearchBtn.classList.add("hidden");
        searchInput.focus();
      });

      // Theme Toggle Logic
      function setTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add("dark");
          themeIcon.classList.replace("fa-moon", "fa-sun");
          themeText.textContent = "切換淺色模式";
          localStorage.theme = "dark";
        } else {
          document.documentElement.classList.remove("dark");
          themeIcon.classList.replace("fa-sun", "fa-moon");
          themeText.textContent = "切換深色模式";
          localStorage.theme = "light";
        }
      }

      themeToggle.addEventListener("click", () => {
        const isDark = document.documentElement.classList.contains("dark");
        setTheme(!isDark);
      });

      // Mobile Sidebar Toggle
      function toggleSidebar() {
        const isClosed = sidebar.classList.contains("-translate-x-full");
        if (isClosed) {
          sidebar.classList.remove("-translate-x-full");
          mobileOverlay.classList.remove("hidden");
        } else {
          sidebar.classList.add("-translate-x-full");
          mobileOverlay.classList.add("hidden");
        }
      }

      function closeSidebarOnMobile() {
        if (window.innerWidth < 1024) {
          // lg breakpoint
          sidebar.classList.add("-translate-x-full");
          mobileOverlay.classList.add("hidden");
        }
      }

      // Initialize
      function init() {
        // Check system preference or saved theme
        if (
          localStorage.theme === "dark" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          setTheme(true);
        } else {
          setTheme(false);
        }

        renderNavigation();
        renderBookmarks();
      }

      init();
    </script>
  </body>
</html>
